# ============================================================================================
#  Lucent version catalogue (UPGRADE-PLAN-2.8 P0-5)
# ============================================================================================
#
# Three groups, on purpose:
#   shared      — libraries the shared/ tree compiles against on BOTH platforms. These MUST stay
#                 identical on :app and :desktop; before this catalogue they had already drifted
#                 (OkHttp 4.12.0 vs 5.5.0, coroutines 1.8.1 vs 1.11.0) and only compiled because
#                 the shared code happened to use the API intersection. Unifying them here makes
#                 that a build-enforced invariant instead of a coincidence.
#   android-only — Compose BOM, Room, SQLCipher, DataStore, biometric — nothing on the desktop.
#   desktop-only — sqlite-jdbc (the SQLCipher-scheme driver), PDFBox, JNA (P0-1 DPAPI).
#
# Plugin versions stay in the root build.gradle.kts where they have always lived; this file is
# only for dependency coordinates.

[versions]
# ---- shared group ----
# Unified from :app=4.12.0 / :desktop=5.5.0. The shared code uses the API intersection, so the
# conservative Android-proven version wins; desktop compiles against the same 4.x line.
okhttp = "4.12.0"
# Unified from :app=1.8.1 / :desktop=1.11.0. Same reasoning as OkHttp.
coroutines = "1.8.1"
haze = "1.7.2"
orgJson = "20260814"

# ---- android-only ----
composeBom = "2026.04.01"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
biometric = "1.1.0"
fragmentKtx = "1.8.5"
room = "2.8.4"
sqlcipher = "4.16.0"
sqliteKtx = "2.4.0"
datastore = "1.1.7"

# ---- desktop-only ----
sqliteJdbc = "3.53.4.0"
pdfbox = "3.0.8"
jnaPlatform = "5.19.0"

[libraries]
# ---- shared group (identical on both platforms — do not diverge) ----
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-materials = { module = "dev.chrisbanes.haze:haze-materials", version.ref = "haze" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

# ---- android-only ----
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-ui = { module = "androidx.compose.ui:ui" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-material3 = { module = "androidx.compose.material3:material3" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
sqlite-ktx = { module = "androidx.sqlite:sqlite-ktx", version.ref = "sqliteKtx" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# ---- desktop-only ----
sqlite-jdbc = { module = "io.github.willena:sqlite-jdbc", version.ref = "sqliteJdbc" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jnaPlatform" }
