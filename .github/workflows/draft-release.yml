
name: Create Draft Release from Build Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.8.3)'
        required: true
      title:
        description: 'Release title (e.g., "Lucent 2.8.3 — The Swipe Becomes Natural")'
        required: true
      apk_run_id:
        description: 'APK workflow run ID'
        required: true
      windows_run_id:
        description: 'Windows workflow run ID'
        required: true

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in x.y.z format (e.g., 2.8.3)"
            exit 1
          fi
          echo "Version format valid: $VERSION"

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Wait for APK build to complete
        run: |
          echo "Waiting for APK build run ${{ inputs.apk_run_id }} to complete..."
          for i in {1..60}; do
            STATUS=$(gh run view ${{ inputs.apk_run_id }} --json status,conclusion --jq '.status')
            CONCLUSION=$(gh run view ${{ inputs.apk_run_id }} --json status,conclusion --jq '.conclusion')
            echo "Attempt $i: APK build status=$STATUS, conclusion=$CONCLUSION"
            
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "APK build completed successfully"
                break
              else
                echo "::error::APK build failed with conclusion: $CONCLUSION"
                exit 1
              fi
            fi
            
            if [ $i -eq 60 ]; then
              echo "::error::APK build timed out after 60 minutes"
              exit 1
            fi
            
            sleep 60
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for Windows build to complete
        run: |
          echo "Waiting for Windows build run ${{ inputs.windows_run_id }} to complete..."
          for i in {1..60}; do
            STATUS=$(gh run view ${{ inputs.windows_run_id }} --json status,conclusion --jq '.status')
            CONCLUSION=$(gh run view ${{ inputs.windows_run_id }} --json status,conclusion --jq '.conclusion')
            echo "Attempt $i: Windows build status=$STATUS, conclusion=$CONCLUSION"
            
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Windows build completed successfully"
                break
              else
                echo "::error::Windows build failed with conclusion: $CONCLUSION"
                exit 1
              fi
            fi
            
            if [ $i -eq 60 ]; then
              echo "::error::Windows build timed out after 60 minutes"
              exit 1
            fi
            
            sleep 60
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download APK artifact
        run: |
          echo "Downloading APK from run ${{ inputs.apk_run_id }}..."
          gh run download ${{ inputs.apk_run_id }} -n lucent-release-apk -D ./artifacts/apk
          ls -lh ./artifacts/apk/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows artifact
        run: |
          echo "Downloading Windows EXE from run ${{ inputs.windows_run_id }}..."
          gh run download ${{ inputs.windows_run_id }} -n lucent-windows-exe -D ./artifacts/windows
          ls -lh ./artifacts/windows/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifacts
        run: |
          APK_FILE=$(find ./artifacts/apk -name "*.apk" | head -1)
          EXE_FILE=$(find ./artifacts/windows -name "*.exe" | head -1)
          
          if [ -z "$APK_FILE" ]; then
            echo "::error::APK file not found in artifacts"
            exit 1
          fi
          
          if [ -z "$EXE_FILE" ]; then
            echo "::error::EXE file not found in artifacts"
            exit 1
          fi
          
          APK_SIZE=$(stat -c%s "$APK_FILE")
          EXE_SIZE=$(stat -c%s "$EXE_FILE")
          
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "EXE_FILE=$EXE_FILE" >> $GITHUB_ENV
          echo "APK_SIZE_MB=$(python3 -c "print(f'{$APK_SIZE/1048576:.2f}')")" >> $GITHUB_ENV
          echo "EXE_SIZE_MB=$(python3 -c "print(f'{$EXE_SIZE/1048576:.2f}')")" >> $GITHUB_ENV
          
          echo "Found APK: $APK_FILE ($(python3 -c "print(f'{$APK_SIZE/1048576:.2f}')") MiB)"
          echo "Found EXE: $EXE_FILE ($(python3 -c "print(f'{$EXE_SIZE/1048576:.2f}')") MiB)"

      - name: Read release notes
        run: |
          if [ -f RELEASE_NOTES_${{ inputs.version }}.md ]; then
            NOTES=$(cat RELEASE_NOTES_${{ inputs.version }}.md)
          else
            NOTES="Release ${{ inputs.version }}"
          fi
          
          # Add build info
          NOTES="${NOTES}

---

**Build Info**
- APK Size: ${{ env.APK_SIZE_MB }} MiB
- Windows EXE Size: ${{ env.EXE_SIZE_MB }} MiB
- APK Build: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.apk_run_id }}
- Windows Build: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.windows_run_id }}
- Built from commit: \`${{ github.sha }}\`"
          
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create draft release
        id: create_release
        run: |
          gh release create "v${{ inputs.version }}" \
            --draft \
            --title "${{ inputs.title }}" \
            --notes "${{ env.RELEASE_NOTES }}" \
            "${{ env.APK_FILE }}" \
            "${{ env.EXE_FILE }}"
          
          echo "::notice::Draft release v${{ inputs.version }} created successfully"
          echo "::notice::APK and EXE uploaded"
          echo "::notice::Review at: https://github.com/${{ github.repository }}/releases"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output release URL
        run: |
          RELEASE_URL=$(gh release view "v${{ inputs.version }}" --json url --jq '.url')
          echo "::notice::Draft release created: $RELEASE_URL"
          echo "release_url=$RELEASE_URL" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
