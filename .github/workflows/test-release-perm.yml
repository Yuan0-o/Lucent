name: Test Release Permission
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/Yuan0-o/Lucent --jq .name && echo "API OK"
          gh release create test-perm-$(date +%s) --prerelease --target main --title "perm test" 2>&1 | head -3
