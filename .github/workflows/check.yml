name: check

on:
  workflow_dispatch:

jobs:
  desktop-jvm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run desktop unit tests (shared logic)
        run: ./gradlew :desktop:test --no-daemon --console=plain

      - name: Run detekt
        run: ./gradlew :desktop:detekt --no-daemon --console=plain

      - name: Check i18n generation is up-to-date
        run: |
          python3 tools/i18n/gen_i18n.py
          git diff --exit-code -- shared/src/main/kotlin/com/lucent/app/i18n/I18n.kt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-test-results
          path: desktop/build/reports/tests/test
          if-no-files-found: ignore

  android-jvm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK components
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Run Android JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Run Android lint
        run: ./gradlew :app:lintRelease --no-daemon --console=plain

      - name: Run detekt on shared & app modules
        run: ./gradlew :shared:detekt :app:detekt --no-daemon --console=plain

      - name: Check i18n generation is up-to-date
        run: |
          python3 tools/i18n/gen_i18n.py
          git diff --exit-code -- shared/src/main/kotlin/com/lucent/app/i18n/I18n.kt

      - name: Generate Room exported schemas
        run: ./gradlew :app:kspDebugKotlin --no-daemon --console=plain

      - name: Upload lint baseline
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-baseline
          path: app/lint-baseline.xml
          if-no-files-found: ignore

      - name: Upload Room schema JSON
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: ignore

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-results
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore