# ============================================================================================
#  Lucent — build the Windows desktop app (a single double-click installer .exe)
# ============================================================================================
#
# This is the DESKTOP pipeline. It is entirely separate from build.yml (the Android APK) and shares
# nothing with it — running one never affects the other, which is the requirement's first rule.
#
# What it does, in order:
#   1. Compile the optional native libraries on the Windows runner:
#        • lucent_llama.dll    — the on-device GGUF assistant (llama.cpp, CPU baseline), from the
#          SAME C++ the Android build uses (app/src/main/cpp), via desktop/native/CMakeLists.txt.
#        • lucent_llama_vk.dll — the SAME engine with llama.cpp's Vulkan GPU backend compiled in
#          (task A4 — Windows GPU support, mirroring Android). Best-effort: it needs the Vulkan
#          SDK, which is installed below with continue-on-error; if the SDK or this build fails,
#          the app simply ships CPU-only and the in-app GPU switch falls back to CPU. At runtime,
#          NativeLoader loads the _vk DLL only on machines that actually have vulkan-1.dll.
#        • lucent_native.dll   — the Rust crypto/animation accelerator (rust/), via cargo.
#      Both are OPTIONAL: the app has Kotlin/JCE fallbacks for every path they accelerate, so these
#      steps are `continue-on-error` — a first run still produces a working .exe even if a native
#      build needs a follow-up fix. When they succeed the DLLs are copied to the classpath resource
#      folder (desktop/src/main/resources/native) where NativeLoader looks for them.
#   2. Install WiX, which jpackage needs to produce a Windows .exe installer.
#   3. Package with Compose for Desktop (TargetFormat.Exe) and upload ONLY that one installer.
#
# Historically the flakiest part is a mid-build clone, so llama.cpp is fetched up front with retries
# into the directory the CMakeLists pre-seed hook checks first (mirrors the Android workflow).

name: Build Windows desktop

on:
  workflow_dispatch:

jobs:
  build-windows:
    # A Windows installer (WiX/jpackage) can only be produced on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # (The twin-file drift guard that used to live here is gone: shared code now exists ONCE in
      # shared/src/main/kotlin, compiled by both :app and :desktop, so drift is impossible.)

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        # Same approach as build.yml: the wrapper isn't committed, so the action provides Gradle
        # 9.7.1 directly. DECISION (backlog A-6/W-2 preamble, recorded 2026-07-26): dependency cache
        # ON — main writes, other refs read; a rare cache-service hiccup degrades to a warning,
        # never a failure. This removes most of the ~3.5 min per-run Maven re-download.
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ---- MSVC developer environment + compiler cache (backlog W-2) ----
      # The two llama.cpp engine builds are ~11 min of MSVC compile per run of the SAME pinned
      # b9888 sources. The Visual Studio generator ignores compiler launchers, so the fix is
      # structural: put cl.exe on PATH (vcvars64), switch the builds below to Ninja, and route
      # compiles through sccache backed by the Actions cache. ggml's "ccache found" line under the
      # VS generator was a false comfort — nothing was ever written or restored.
      - name: Set up MSVC developer environment (for Ninja builds)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache (compiler cache for the engine builds)
        uses: mozilla-actions/sccache-action@v0.0.9


      # ---- Resolve every Gradle plugin & dependency up front, with retries ----
      # The 2026-07-22 08:12 run died at the ROOT plugins block: dl.google.com flaked, Gradle
      # burned ~53 s of internal retries, marked the repository unavailable, and then reported the
      # AGP plugin marker as "not found" — after the job had already spent ~13 minutes building the
      # native DLLs. Gradle never retries a build it has already failed, so the only reliable
      # counter is retrying the whole invocation; and doing it HERE, before the long native steps,
      # turns a repository flake at minute 15 into one retried at minute 1.
      #
      # :desktop:compileKotlin is the warm-up task on purpose: it resolves the root plugins (AGP,
      # Kotlin, Compose), every :desktop dependency (including the sqlite-jdbc cipher driver), and
      # compiles the module — all of which lands in GRADLE_USER_HOME / build/ and is reused by the
      # cipher-check and packaging steps below, leaving them almost nothing to fetch. A genuine
      # compile error also surfaces here (after the retries, unavoidably — a script can't tell a
      # flaky repository from a broken build) instead of a quarter hour later. Same red, earlier.
      # W-6 (2026-09-02 post-mortem): the warm-up used to retry exactly 4 times at a fixed 45 s —
      # about 5 minutes of wall coverage. That morning all three artifact repositories (Google,
      # Maven Central, the Gradle Plugin Portal) were unreachable from the Windows runner for
      # ~13 minutes: every attempt died on "Plugin ... was not found in any of the following
      # sources / could not resolve plugin artifact ..." and the job went red although nothing in
      # the repo had changed (the same commit went green 13 minutes later). Retrying longer is only
      # safe if the script knows WHAT failed, so it now classifies the failure from the log text: a
      # network/repository marker buys another attempt with escalating backoff (total wall coverage
      # well beyond the observed 13-minute outage), while a genuine compile error fails the job
      # immediately instead of burning the runner on doomed retries.
      - name: Resolve Gradle plugins + dependencies, compile :desktop (network-aware retries)
        shell: pwsh
        run: |
          $maxAttempts = 6
          # Backoff (seconds) between attempts 1-2, 2-3, ... 5-6. Escalating on purpose: a short
          # repository blip clears quickly, the long outage of 2026-09-02 needed ~13 minutes.
          $backoffSeconds = @(45, 60, 120, 240, 300)
          # Log fragments that mean "the network/repository layer failed" - worth a retry. This
          # list leads with exactly the failure text seen on 2026-09-02, followed by the usual
          # Gradle transport errors. Anything else (a Kotlin compile error, a missing SDK
          # component, disk space...) is a REAL build problem and must not be retried.
          $networkMarkers = @(
            'was not found in any of the following sources',
            'Could not resolve plugin artifact',
            'Could not GET', 'Could not HEAD', 'Could not POST',
            'Read timed out', 'timed out',
            'Connection refused', 'Connection reset', 'Connection timed out',
            'Remote host terminated the handshake',
            'Premature end of Content-Length',
            'SSLHandshakeException', 'SSLPeerUnverifiedException',
            'Unexpected end of file from server',
            'repository was unavailable', 'marked the repository unavailable',
            'Received status code 5', 'Received status code 429'
          )
          for ($i = 1; $i -le $maxAttempts; $i++) {
            # Tee keeps the live log flowing while also giving us the text to classify.
            $lines = @()
            gradle :desktop:compileKotlin --no-daemon --stacktrace 2>&1 | Tee-Object -Variable lines
            $code = $LASTEXITCODE
            if ($code -eq 0) { Write-Host "Gradle warm-up OK on attempt $i."; exit 0 }
            $text = $lines | Out-String
            $isNetwork = $false
            foreach ($marker in $networkMarkers) {
              if ($text.IndexOf($marker, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
                $isNetwork = $true
                break
              }
            }
            if (-not $isNetwork) {
              Write-Error "Gradle warm-up attempt $i failed (exit $code) with an error that does not match any network/repository marker - see the full output above. Treated as a genuine build problem; NOT retried."
              exit 1
            }
            if ($i -lt $maxAttempts) {
              $wait = $backoffSeconds[$i - 1]
              Write-Warning "Gradle warm-up attempt $i failed (exit $code) with a repository/network error (like the multi-repo outage of 2026-09-02). Retrying in $wait s (attempt $($i + 1) of $maxAttempts)."
              Start-Sleep -Seconds $wait
            }
          }
          Write-Error "Gradle warm-up failed after $maxAttempts attempts - every failure matched a network/repository marker. See the last stacktrace above. If the artifact repositories stay unreachable this long, re-run the workflow once GitHub's infrastructure recovers."
          exit 1

      # ---- llama.cpp source, fetched up front with retries (pinned b9888) ----
      # Cloned into the directory desktop/native/CMakeLists.txt pre-seeds from, so the compile step
      # never has to hit the network mid-build. PowerShell here because the runner is Windows.
      - name: Prefetch llama.cpp (pinned b9888)
        shell: pwsh
        run: |
          $dest = "desktop/native/llama.cpp-src"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
            git clone --depth 1 --branch b9888 https://github.com/ggml-org/llama.cpp $dest
            if ($LASTEXITCODE -eq 0) { Write-Host "llama.cpp cloned on attempt $attempt"; break }
            if ($attempt -eq 3) { Write-Error "Failed to clone llama.cpp after 3 attempts."; exit 1 }
            Start-Sleep -Seconds 10
          }

      # ---- lucent_llama.dll (llama.cpp, CPU baseline) ----
      # continue-on-error: an on-device-model build failure must not block the whole installer — the
      # app runs fine without it (the local model just stays unavailable until the DLL is fixed).
      # This CPU build runs FIRST and is never mixed with the Vulkan build below, so a Vulkan
      # failure can only cost the GPU variant, never the baseline engine.
      - name: Build lucent_llama.dll (CMake, CPU baseline)
        continue-on-error: true
        shell: pwsh
        run: |
          # Ninja + sccache (backlog W-2): the VS generator ignored compiler launchers, so these
          # builds compiled cold every run. cl.exe comes from the msvc-dev-cmd step above. The two
          # engine builds share one cache — they compile mostly identical objects, so the Vulkan
          # build below warms itself from this one even on a cold day.
          cmake -S desktop/native -B desktop/native/build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build desktop/native/build --parallel
          New-Item -ItemType Directory -Force -Path desktop/src/main/resources/native | Out-Null
          $dll = Get-ChildItem -Recurse -Path desktop/native/build -Filter lucent_llama.dll | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName desktop/src/main/resources/native/lucent_llama.dll -Force
            Write-Host "Copied $($dll.FullName)"
          } else {
            Write-Warning "lucent_llama.dll not found; the packaged app will run without the on-device model."
          }

      # ---- Vulkan SDK, for the optional GPU-enabled engine build (task A4) ----
      # Pinned LunarG SDK, installed silently the same way llama.cpp's own Windows CI does it.
      # Best-effort by design: no SDK just means no GPU variant this round. The whole install is
      # wrapped in try/catch and the step ends with `exit 0`, so it can NEVER fail the job AND
      # never leaves a red "Process completed with exit code 1" annotation on an otherwise-green
      # run — even if the pinned version is unpublished and the download returns an error page.
      # (continue-on-error stays as a second safety net.) On success the installer writes to
      # C:\VulkanSDK\<version> and VULKAN_SDK is exported via GITHUB_ENV, because the machine-wide
      # variable the installer sets isn't visible to a job that is already running; on any failure
      # VULKAN_SDK is left unset and the GPU-engine build below skips itself (CPU engine still ships).
      # W-3: the 244 MB installer is cached across runs, keyed on the pinned version — a warm run
      # skips LunarG entirely, removing an external download dependency from every build.
      - name: Cache Vulkan SDK installer
        uses: actions/cache@v4
        with:
          path: .vulkan-installer
          key: vulkan-installer-1.4.321.1

      - name: Install Vulkan SDK
        continue-on-error: true
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.321.1
        run: |
          # Every failure path here is caught and turned into a warning + `exit 0`, so this step
          # never emits a red "exit code 1" annotation. When it can't install, VULKAN_SDK is left
          # unset and the GPU-engine build below skips itself; the CPU engine still ships.
          $ErrorActionPreference = 'Continue'
          try {
            # Download one candidate URL; $true only if it fetched a real PE binary.
            # -f makes curl FAIL on an HTTP error (e.g. an unpublished version -> 404) instead
            # of silently saving the error page as the .exe; the 'MZ' magic check catches any
            # error page that slipped through anyway. Every attempt is logged with its URL and
            # curl exit code, because the 2026-07-22 runs failing WITHOUT saying which URLs
            # were tried is exactly how this section stayed hard to debug.
            function Get-Installer([string]$url, [string]$dest) {
              Write-Host "trying: $url"
              curl.exe -fSL -o $dest $url
              if ($LASTEXITCODE -ne 0) { Write-Host "  -> curl exit $LASTEXITCODE"; return $false }
              $magic = Get-Content -Path $dest -AsByteStream -TotalCount 2 -ErrorAction Stop
              if ($magic.Count -lt 2 -or $magic[0] -ne 0x4D -or $magic[1] -ne 0x5A) {
                Write-Host "  -> not a PE binary (no 'MZ' header)"; return $false
              }
              Write-Host "  -> OK ($([math]::Round((Get-Item $dest).Length / 1mb)) MB)"
              return $true
            }
            # LunarG has shipped the Windows installer under several names over the years, and the
            # 2026-07-22 runs proved the classic VulkanSDK-<ver>-Installer.exe now 404s even for
            # the version their own latest/windows.txt reports. So: try every filename scheme
            # they've used, for the pinned version first (reproducibility), then the current
            # latest, then the version-independent "latest" alias URLs as the final net.
            $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
            # W-3: a previously cached installer skips the download entirely (MZ-checked, same as
            # a fresh fetch, so a corrupt cache entry can never be executed).
            $cached = ".vulkan-installer\vulkan_sdk-$env:VULKAN_VERSION.exe"
            $versions = @($env:VULKAN_VERSION)
            $latest = (curl.exe -fsSL "https://vulkan.lunarg.com/sdk/latest/windows.txt")
            if ($LASTEXITCODE -eq 0 -and $latest) {
              $latest = $latest.Trim()
              if ($latest -match '^\d+(\.\d+){1,3}$') {
                Write-Host "LunarG latest/windows.txt reports: $latest"
                if ($latest -ne $env:VULKAN_VERSION) { $versions += $latest }
              } else {
                Write-Host "latest/windows.txt returned something that is not a version: '$latest' - ignoring it."
              }
            } else {
              Write-Host "could not query latest/windows.txt (curl exit $LASTEXITCODE)."
            }
            $got = $false
            if (Test-Path $cached) {
              $magic = Get-Content -Path $cached -AsByteStream -TotalCount 2 -ErrorAction SilentlyContinue
              if ($magic.Count -eq 2 -and $magic[0] -eq 0x4D -and $magic[1] -eq 0x5A) {
                Copy-Item $cached $installer -Force
                Write-Host "using cached installer ($([math]::Round((Get-Item $installer).Length / 1mb)) MB) - no download needed."
                $got = $true
              }
            }
            if (-not $got) {
              foreach ($ver in $versions) {
                # W-3: "vulkan_sdk.exe" FIRST — the 2026-07-22 runs proved the classic
                # VulkanSDK-<ver>-Installer.exe now 404s for every version, so leading with it
                # guaranteed one red curl line per run. The old candidates stay as the safety net.
                foreach ($name in "vulkan_sdk.exe", "VulkanSDK-$ver-Installer.exe", "vulkansdk-windows-X64-$ver.exe", "vulkan-sdk.exe") {
                  if (Get-Installer "https://sdk.lunarg.com/sdk/download/$ver/windows/$name" $installer) { $got = $true; break }
                }
                if ($got) { break }
              }
              if ($got) {
                New-Item -ItemType Directory -Force -Path .vulkan-installer | Out-Null
                Copy-Item $installer $cached -Force
              }
            }
            if (-not $got) {
              foreach ($name in "vulkan_sdk.exe", "vulkan-sdk.exe") {
                if (Get-Installer "https://sdk.lunarg.com/sdk/download/latest/windows/$name" $installer) { $got = $true; break }
              }
            }
            $sdkPath = $null
            if ($got) {
              $proc = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -ErrorAction Stop
              if ($proc.ExitCode -ne 0) { throw "installer exited with code $($proc.ExitCode)" }
              # Don't assume the directory name from the version string we asked for: an alias
              # download installs whatever version it actually is. Export the SDK dir that exists.
              $dir = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction Stop | Sort-Object Name -Descending | Select-Object -First 1
              if (-not $dir) { throw "installer succeeded but C:\VulkanSDK contains no SDK directory" }
              $sdkPath = $dir.FullName
              Write-Host "Vulkan SDK $($dir.Name) installed at $sdkPath."
            } else {
              # ---- Plan B: LunarG is unreachable, so assemble a minimal SDK ourselves. ----
              # The GPU-engine build reads exactly three things out of VULKAN_SDK (via FindVulkan):
              #   Include\vulkan (+ spirv)  <- KhronosGroup/Vulkan-Headers (+ SPIRV-Headers)
              #   Lib\vulkan-1.lib          <- the import library, built from KhronosGroup/Vulkan-Loader
              #   Bin\glslc.exe             <- the shader compiler the runner's preinstalled Android NDK ships
              # None of that depends on LunarG's download site, and the produced DLL still merely
              # IMPORTS the end user's own vulkan-1.dll at runtime, exactly like an official-SDK
              # build — we ship no loader of our own.
              Write-Warning "No LunarG installer URL worked; assembling a minimal Vulkan SDK from Khronos sources instead."
              $mini = Join-Path $env:RUNNER_TEMP "vk-mini-sdk"
              New-Item -ItemType Directory -Force -Path "$mini\Include","$mini\Lib","$mini\Bin" | Out-Null
              $src = Join-Path $env:RUNNER_TEMP "vk-src"
              git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers "$src\headers"
              git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers "$src\spirv"
              git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Loader "$src\loader"
              foreach ($r in "headers","spirv","loader") { Write-Host ("  {0} @ {1}" -f $r, (git -C "$src\$r" rev-parse --short HEAD)) }
              cmake -S "$src\headers" -B "$src\headers\b" | Out-Null
              cmake --install "$src\headers\b" --prefix "$src\headers\out" | Out-Null
              Copy-Item -Recurse -Force "$src\headers\out\include\*" "$mini\Include\"
              Copy-Item -Recurse -Force "$src\spirv\include\spirv" "$mini\Include\"
              cmake -S "$src\loader" -B "$src\loader\b" -A x64 -DVULKAN_HEADERS_INSTALL_DIR="$src\headers\out" -DBUILD_TESTS=OFF
              cmake --build "$src\loader\b" --config Release --parallel
              $lib = Get-ChildItem -Recurse -Path "$src\loader\b" -Filter vulkan-1.lib | Select-Object -First 1
              if (-not $lib) { throw "Vulkan-Loader build produced no vulkan-1.lib" }
              Copy-Item $lib.FullName "$mini\Lib\vulkan-1.lib" -Force
              $ndkRoots = @($env:ANDROID_NDK_HOME, $env:ANDROID_NDK_ROOT, $env:ANDROID_NDK, $env:ANDROID_NDK_LATEST_HOME) | Where-Object { $_ }
              if ($env:ANDROID_SDK_ROOT) { $ndkRoots += (Get-ChildItem "$env:ANDROID_SDK_ROOT\ndk" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object FullName) }
              $glslc = $ndkRoots | ForEach-Object { Join-Path $_ "shader-tools\windows-x86_64\glslc.exe" } | Where-Object { Test-Path $_ } | Select-Object -First 1
              if (-not $glslc) { throw "no glslc found in any preinstalled Android NDK (looked in: $($ndkRoots -join '; '))" }
              Write-Host "using NDK glslc: $glslc"
              Copy-Item $glslc "$mini\Bin\glslc.exe" -Force
              $sdkPath = $mini
              Write-Host "Minimal Vulkan SDK assembled at $sdkPath."
            }
            "VULKAN_SDK=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } catch {
            Write-Warning "Vulkan SDK unavailable ($($_.Exception.Message)); skipping the GPU engine build. The CPU engine still ships."
          }
          # A missing GPU SDK is an expected, harmless outcome - not a build failure.
          exit 0

      # ---- lucent_llama_vk.dll (llama.cpp, Vulkan GPU backend) ----
      # A SECOND build of the same engine, in its own build directory, with the GPU backend
      # compiled in. Also continue-on-error, and it checks for the SDK itself, so every failure
      # mode ends the same harmless way: the app ships with only the CPU engine.
      - name: Build lucent_llama_vk.dll (CMake, Vulkan GPU backend)
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not $env:VULKAN_SDK -or -not (Test-Path $env:VULKAN_SDK)) {
            Write-Warning "Vulkan SDK unavailable; skipping the GPU engine build (the CPU engine above still ships)."
            exit 0
          }
          cmake -S desktop/native -B desktop/native/build-vk -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUCENT_ENABLE_VULKAN=ON `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build desktop/native/build-vk --parallel
          $dll = Get-ChildItem -Recurse -Path desktop/native/build-vk -Filter lucent_llama.dll | Select-Object -First 1
          if ($dll) {
            New-Item -ItemType Directory -Force -Path desktop/src/main/resources/native | Out-Null
            Copy-Item $dll.FullName desktop/src/main/resources/native/lucent_llama_vk.dll -Force
            Write-Host "Copied $($dll.FullName) as lucent_llama_vk.dll"
          } else {
            Write-Warning "Vulkan engine build produced no DLL; the app ships CPU-only (the GPU switch will fall back to CPU)."
          }

      # ---- lucent_native.dll (Rust accelerator) ----
      # Also optional: nativebridge/LucentNative has a Kotlin/JCE fallback for every function.
      # W-5: the Windows twin of Android's A-2/A-3 — registry, git checkouts and target/ cached on
      # the lockfile, so warm runs compile only lucent_native itself (no "Downloading crates").
      - name: Cache Cargo (registry + rust/target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-win-msvc-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-win-msvc-

      - name: Set up Rust (MSVC target)
        continue-on-error: true
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build lucent_native.dll (cargo)
        continue-on-error: true
        shell: pwsh
        run: |
          cargo build --release --manifest-path rust/Cargo.toml --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path desktop/src/main/resources/native | Out-Null
          $dll = "rust/target/x86_64-pc-windows-msvc/release/lucent_native.dll"
          if (Test-Path $dll) {
            Copy-Item $dll desktop/src/main/resources/native/lucent_native.dll -Force
            Write-Host "Copied $dll"
          } else {
            Write-Warning "lucent_native.dll not found; the app will use its Kotlin/JCE fallbacks."
          }

      # ---- WiX, required by jpackage to build a Windows .exe installer ----
      # ---- Prove at-rest encryption before anything gets packaged ----
      # The whole point of swapping the JDBC driver is that the desktop database is REALLY
      # encrypted. This runs a tiny end-to-end check against the driver Gradle actually resolved
      # (cipher core answers, file header scrambled, right key reads, wrong key rejected — see
      # desktop/src/main/kotlin/com/lucent/desktop/CipherSelfCheck.kt) and fails the job in red if
      # any of it is untrue. Encryption is a launch requirement, not best-effort: unlike the GPU
      # engine, this step is allowed to stop the build.
      # One retry, 30 s apart: after the warm-up above almost everything is served from the local
      # Gradle home, but a residual fetch can still flake. A GENUINE self-check failure (encryption
      # not engaging) fails identically on both attempts and still stops the build in red.
      - name: Verify database encryption (cipher self-check)
        shell: pwsh
        run: |
          gradle :desktop:cipherSelfCheck --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "cipherSelfCheck attempt 1 failed (exit $LASTEXITCODE); retrying once in 30 s in case it was a transient fetch."
            Start-Sleep -Seconds 30
            gradle :desktop:cipherSelfCheck --no-daemon --stacktrace
          }
          exit $LASTEXITCODE

      # ---- Surface which engines actually made it into this build ----
      # A green run used to be silent about the one thing worth knowing here: whether the
      # best-effort GPU engine is in the installer, or the Vulkan chain quietly fell through
      # (as it did on 2026-07-22, when the pinned SDK download 404'd and the app shipped
      # CPU-only without a word). This step puts the answer on the run's summary page and
      # raises a yellow annotation when the GPU engine is missing, so nobody has to spelunk
      # step logs to learn what shipped.
      - name: Report bundled engines
        shell: pwsh
        run: |
          $dir = "desktop/src/main/resources/native"
          $rows = @()
          foreach ($name in "lucent_llama.dll","lucent_llama_vk.dll","lucent_native.dll") {
            $f = Join-Path $dir $name
            if (Test-Path $f) {
              $kb = [math]::Round((Get-Item $f).Length / 1kb)
              $rows += "| $name | bundled | $kb KB |"
            } else {
              $rows += "| $name | absent | - |"
            }
          }
          $summary = @("### Engines in this installer", "", "| DLL | Status | Size |", "|---|---|---|") + $rows
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Test-Path (Join-Path $dir "lucent_llama_vk.dll")) {
            Write-Host "::notice title=GPU engine bundled::lucent_llama_vk.dll is in this installer - the in-app GPU switch has a real backend on Vulkan-capable machines."
          } else {
            Write-Host "::warning title=GPU engine missing::lucent_llama_vk.dll was NOT produced - this installer is CPU-only and the in-app GPU switch will silently fall back. Check the 'Install Vulkan SDK' and 'Build lucent_llama_vk.dll' steps above."
          }
          if (-not (Test-Path (Join-Path $dir "lucent_llama.dll"))) {
            Write-Host "::warning title=CPU engine missing::lucent_llama.dll was NOT produced - local models will be unavailable in this build."
          }

      # W-4: the choco WiX step is GONE — it spent ~20 s installing a toolset nothing consumes
      # (packaging uses the WiX 3.11 that Compose's own :desktop:downloadWix task fetches). That
      # Gradle download (~27 s from GitHub) is cached below instead, keyed on the WiX version, so
      # warm runs package with zero WiX network fetches.
      - name: Cache WiX (Compose downloadWix output)
        uses: actions/cache@v4
        with:
          path: desktop/build/wixToolset
          key: wix311-compose

      # ---- Package the installer ----
      # packageDistributionForCurrentOS honours desktop/build.gradle.kts's TargetFormat.Exe and emits
      # the installer under desktop/build/compose/binaries/main/exe/.
      - name: Package Windows .exe
        shell: pwsh
        run: |
          gradle :desktop:packageDistributionForCurrentOS --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "packaging attempt 1 failed (exit $LASTEXITCODE); retrying once in 30 s in case it was a transient fetch."
            Start-Sleep -Seconds 30
            gradle :desktop:packageDistributionForCurrentOS --no-daemon --stacktrace
          }
          exit $LASTEXITCODE

      # ---- PHASE 4: Authenticode-sign the installer (optional, secrets-gated) ----
      # Runs ONLY when both signing secrets exist; a fork or a build without them still produces a
      # working (unsigned) installer, so signing can never be the reason a build fails to exist.
      # The certificate is a self-signed code-signing cert the maintainer generated: it gives the
      # exe a verifiable,
      # tamper-evident publisher identity and stable upgrade continuity. It does NOT by itself
      # remove the SmartScreen "unknown publisher" prompt — only a paid OV/EV certificate from a
      # public CA does that; the doc spells out the difference honestly.
      #   LUCENT_SIGN_PFX_BASE64    the .pfx certificate file, base64-encoded to text
      #   LUCENT_SIGN_PFX_PASSWORD  the password chosen when exporting the .pfx
      - name: Sign installer (runs only when signing secrets are configured)
        shell: pwsh
        env:
          LUCENT_SIGN_PFX_BASE64: ${{ secrets.LUCENT_SIGN_PFX_BASE64 }}
          LUCENT_SIGN_PFX_PASSWORD: ${{ secrets.LUCENT_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:LUCENT_SIGN_PFX_BASE64 -or -not $env:LUCENT_SIGN_PFX_PASSWORD) {
            Write-Host "::notice title=Installer not signed::LUCENT_SIGN_PFX_BASE64 / LUCENT_SIGN_PFX_PASSWORD are not set - uploading an unsigned installer. Add both under Settings -> Secrets and variables -> Actions to enable signing."
            exit 0
          }
          $ErrorActionPreference = 'Stop'
          # signtool ships in the Windows SDK already on the runner image; take the newest x64 copy.
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found on this runner image."; exit 1 }
          Write-Host "using $($signtool.FullName)"
          # Decode the certificate to the runner's temp dir for this one job; the runner VM is
          # destroyed afterwards, and we delete the file anyway out of habit, not necessity.
          $pfx = Join-Path $env:RUNNER_TEMP "lucent-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:LUCENT_SIGN_PFX_BASE64))
          try {
            $exes = Get-ChildItem "desktop/build/compose/binaries/main/exe/*.exe"
            if (-not $exes) { Write-Error "no installer .exe found to sign"; exit 1 }
            foreach ($exe in $exes) {
              # RFC-3161 timestamp first: with it, the signature stays valid after the cert itself
              # expires (and lets a future shorter-lived cert make sense). If the timestamp server
              # is unreachable, sign WITHOUT it rather than fail the build - an untimestamped
              # signature is still a signature.
              & $signtool.FullName sign /f $pfx /p $env:LUCENT_SIGN_PFX_PASSWORD /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $exe.FullName
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "signing with timestamp failed (server hiccup?); retrying without a timestamp."
                & $signtool.FullName sign /f $pfx /p $env:LUCENT_SIGN_PFX_PASSWORD /fd SHA256 $exe.FullName
                if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed on $($exe.Name)"; exit 1 }
              }
              # Verification, corrected after the first real signing run (2026-07-26): signtool's
              # /pa ALSO walks the chain to a trusted root, so it must fail for a self-signed
              # certificate on a machine that never imported it - the run proved exactly that,
              # one line after "Successfully signed". What we can honestly assert is: the file
              # now CARRIES an Authenticode signature and it is OURS. Get-AuthenticodeSignature
              # gives both: HashMismatch would mean a corrupt signature; UnknownError is the
              # documented status for "valid signature, untrusted (self-signed) root" and becomes
              # Valid the day a CA-issued certificate replaces this one - both pass here.
              $sig = Get-AuthenticodeSignature $exe.FullName
              if (-not $sig.SignerCertificate) {
                Write-Error "no Authenticode signature found on $($exe.Name) after signing"; exit 1
              }
              if ($sig.SignerCertificate.Subject -notlike "*Z-ERA*") {
                Write-Error "unexpected signer on $($exe.Name): $($sig.SignerCertificate.Subject)"; exit 1
              }
              if ($sig.Status -ne 'Valid' -and $sig.Status -ne 'UnknownError') {
                Write-Error "signature check failed on $($exe.Name): $($sig.Status) - $($sig.StatusMessage)"; exit 1
              }
              Write-Host "::notice title=Installer signed::$($exe.Name) is Authenticode-signed by $($sig.SignerCertificate.Subject) (status: $($sig.Status); UnknownError = self-signed root, expected)."
            }
          } finally {
            Remove-Item $pfx -ErrorAction SilentlyContinue
          }

      # v2.4.0: hand the release its final name on the runner, so the artifact is already
      # "Lucent.for.Windows-<version>.exe" when it leaves the pipeline.
      - name: Rename installer to the release asset name
        shell: pwsh
        run: |
          $ver = (Select-String -Path desktop/build.gradle.kts -Pattern 'packageVersion = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $ver) { Write-Error "could not read packageVersion from desktop/build.gradle.kts"; exit 1 }
          $exe = Get-ChildItem desktop/build/compose/binaries/main/exe/*.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "no installer .exe found to rename"; exit 1 }
          $target = "Lucent.for.Windows-$ver.exe"
          if ($exe.Name -ne $target) { Move-Item -Force $exe.FullName (Join-Path $exe.DirectoryName $target) }
          Write-Host "renamed to $target"

      # ---- Upload ONLY the one installer, as agreed ----
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lucent-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
