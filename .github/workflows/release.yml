name: Release (APK + EXE + draft)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 2.8.4. Leave blank to use MARKETING_VERSION in build files.'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Resolve version
        id: resolve-version
        run: |
          VER="${{ inputs.version_name }}"
          if [ -z "$VER" ]; then
            VER=$(sed -n 's/^val MARKETING_VERSION = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          fi
          if [ -z "$VER" ]; then echo "::error::Could not determine version"; exit 1; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building APK for version $VER"

      - name: Check signing secrets are configured
        env:
          LUCENT_KEYSTORE_BASE64: ${{ secrets.LUCENT_KEYSTORE_BASE64 }}
          LUCENT_KEYSTORE_PASSWORD: ${{ secrets.LUCENT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$LUCENT_KEYSTORE_BASE64" ] || [ -z "$LUCENT_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secret LUCENT_KEYSTORE_BASE64 and/or LUCENT_KEYSTORE_PASSWORD."
            echo "::error::Add both under: Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "Both signing secrets are present."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK components
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Cache Cargo (registry, cargo-ndk, rust/target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-android-ndk4.1.2-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-android-ndk4.1.2-

      - name: Set up Rust for Android
        run: |
          set -eu
          rustup target add aarch64-linux-android armv7-linux-androideabi
          if cargo ndk --version 2>/dev/null | grep -q "4.1.2"; then
            echo "cargo-ndk 4.1.2 already present (cache hit) - skipping install."
          else
            cargo install cargo-ndk --version 4.1.2 --locked
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Prefetch llama.cpp (pinned b11057)
        run: |
          set -eu
          DEST="app/src/main/cpp/llama.cpp-src"
          for attempt in 1 2 3; do
            rm -rf "$DEST"
            if git clone --depth 1 --branch b11057 https://github.com/ggml-org/llama.cpp "$DEST"; then
              echo "llama.cpp cloned on attempt $attempt"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Failed to clone llama.cpp after 3 attempts."
              exit 1
            fi
            sleep 10
          done

      - name: Cache ccache (C/C++ build cache)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-lucent-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-lucent-${{ runner.os }}-

      - name: Set up ccache
        run: |
          set -eu
          command -v ccache >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ccache; }
          echo "CCACHE_DIR=${{ runner.temp }}/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ccache"
          ccache --version | head -1

      - name: Provide Vulkan shader compiler (glslc)
        run: |
          set -eu
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          GLSLC_DIR="$NDK/shader-tools/linux-x86_64"
          OK=0
          if [ -x "$GLSLC_DIR/glslc" ]; then
            if [ -f "$GLSLC_DIR/libc++.so" ] && [ ! -e "$GLSLC_DIR/libc++.so.1" ]; then
              ln -sf libc++.so "$GLSLC_DIR/libc++.so.1" || true
            fi
            if LD_LIBRARY_PATH="$GLSLC_DIR:${LD_LIBRARY_PATH:-}" "$GLSLC_DIR/glslc" --version; then
              echo "$GLSLC_DIR" >> "$GITHUB_PATH"
              echo "LD_LIBRARY_PATH=$GLSLC_DIR:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
              echo "Using NDK glslc: $GLSLC_DIR/glslc"
              OK=1
            fi
          fi
          if [ "$OK" != "1" ]; then
            echo "NDK glslc unavailable; installing a system glslc as fallback."
            [ -e "$GLSLC_DIR/glslc" ] && mv "$GLSLC_DIR/glslc" "$GLSLC_DIR/glslc.disabled" || true
            sudo apt-get update
            sudo apt-get install -y glslc || sudo apt-get install -y glslang-tools || true
            glslc --version || glslangValidator --version || true
          fi

      - name: Provide SPIRV-Headers (for the Vulkan GPU backend)
        run: |
          set -eu
          SRC="$RUNNER_TEMP/spirv-headers"
          PREFIX="$RUNNER_TEMP/spirv-headers-install"
          for attempt in 1 2 3; do
            rm -rf "$SRC"
            if git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers "$SRC"; then break; fi
            [ "$attempt" = "3" ] && { echo "::error::Failed to clone SPIRV-Headers."; exit 1; }
            sleep 5
          done
          cmake -S "$SRC" -B "$SRC/build" -DCMAKE_INSTALL_PREFIX="$PREFIX" >/dev/null
          cmake --install "$SRC/build" >/dev/null
          CFG="$(find "$PREFIX" -name 'SPIRV-HeadersConfig.cmake' -o -name 'spirv-headers-config.cmake' | head -n 1)"
          if [ -z "$CFG" ]; then
            echo "::error::SPIRV-Headers installed but no config file found under $PREFIX."
            exit 1
          fi
          CFG_DIR="$(dirname "$CFG")"
          echo "LUCENT_SPIRV_HEADERS_DIR=$CFG_DIR" >> "$GITHUB_ENV"
          echo "SPIRV-Headers config: $CFG_DIR"

      - name: Provide Vulkan & SPIR-V headers for the compile
        run: |
          set -eu
          SRC="$RUNNER_TEMP/vulkan-headers"
          for attempt in 1 2 3; do
            rm -rf "$SRC"
            if git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers "$SRC"; then break; fi
            [ "$attempt" = "3" ] && { echo "::error::Failed to clone Vulkan-Headers."; exit 1; }
            sleep 5
          done
          if [ -d "$RUNNER_TEMP/spirv-headers/include/spirv" ]; then
            cp -r "$RUNNER_TEMP/spirv-headers/include/spirv" "$SRC/include/"
          elif [ -d "$RUNNER_TEMP/spirv-headers-install/include/spirv" ]; then
            cp -r "$RUNNER_TEMP/spirv-headers-install/include/spirv" "$SRC/include/"
          fi
          if [ ! -f "$SRC/include/vulkan/vulkan.hpp" ] || [ ! -f "$SRC/include/spirv/unified1/spirv.hpp" ]; then
            echo "::error::Merged include dir missing vulkan.hpp and/or spirv.hpp."
            ls -R "$SRC/include" | head -40
            exit 1
          fi
          echo "LUCENT_VULKAN_INCLUDE_DIR=$SRC/include" >> "$GITHUB_ENV"
          echo "Vulkan + SPIR-V headers merged into: $SRC/include"

      - name: Decode release keystore from secret
        env:
          LUCENT_KEYSTORE_BASE64: ${{ secrets.LUCENT_KEYSTORE_BASE64 }}
        run: |
          set -eu
          printf '%s' "$LUCENT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lucent-release.keystore"
          echo "Keystore decoded ($(stat -c%s "$RUNNER_TEMP/lucent-release.keystore") bytes)."

      - name: Assemble signed RELEASE APK
        env:
          LUCENT_KEYSTORE_FILE: ${{ runner.temp }}/lucent-release.keystore
          LUCENT_KEYSTORE_PASSWORD: ${{ secrets.LUCENT_KEYSTORE_PASSWORD }}
          LUCENT_KEY_ALIAS: lucent
        run: |
          set -eu
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName='${{ steps.resolve-version.outputs.version }}'

      - name: Report APK size and upload R8 mapping
        run: |
          set -eu
          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          if [ -n "$APK" ]; then
            SIZE_BYTES="$(stat -c%s "$APK")"
            SIZE_MB="$(python3 -c "print(f'{$SIZE_BYTES/1048576:.2f}')")"
            echo "Release APK size: ${SIZE_MB} MiB (${SIZE_BYTES} bytes) — $APK"
            echo "::notice::APK on disk: ${SIZE_MB} MiB (${SIZE_BYTES} bytes). The artifact download is smaller — it is a zip of this file."
          else
            echo "::warning::no signed APK found yet to measure (expected before assembleRelease)."
          fi
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            echo "mapping.txt found ($(stat -c%s app/build/outputs/mapping/release/mapping.txt) bytes) — R8 minification is active."
          else
            echo "::warning::no mapping.txt at app/build/outputs/mapping/release/mapping.txt — R8 minification may be off."
          fi

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r8-mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Verify the APK is a signed release (not debug, not unsigned)
        run: |
          set -eu
          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK found in app/build/outputs/apk/release."
            exit 1
          fi
          echo "Release APK: $APK ($(stat -c%s "$APK") bytes)"
          case "$APK" in
            *unsigned*)
              echo "::error::APK is UNSIGNED ($APK). Check the signing secrets and keystore."
              exit 1 ;;
          esac
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort | tail -n 1)"
          echo "Using: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          echo "Signature verified — this is a signed RELEASE build."

      - name: Rename APK to the release asset name
        run: |
          set -eu
          VER="${{ steps.resolve-version.outputs.version }}"
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)
          [ -n "$APK" ] || { echo "::error::no release APK found to rename"; exit 1; }
          mv "$APK" "app/build/outputs/apk/release/Lucent.for.Android-$VER.apk"
          echo "renamed to Lucent.for.Android-$VER.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: lucent-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Resolve version
        id: resolve-version
        run: |
          $ver = "${{ inputs.version_name }}"
          if (-not $ver) {
            $ver = (Select-String -Path desktop/build.gradle.kts -Pattern 'packageVersion = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          }
          if (-not $ver) { Write-Error "Could not determine version"; exit 1 }
          echo "version=$ver" >> "$env:GITHUB_OUTPUT"
          Write-Host "Building Windows EXE for version $ver"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up MSVC developer environment (for Ninja builds)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache (compiler cache for the engine builds)
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Resolve Gradle plugins + dependencies, compile :desktop (network-aware retries)
        shell: pwsh
        run: |
          $maxAttempts = 6
          $backoffSeconds = @(45, 60, 120, 240, 300)
          $networkMarkers = @(
            'was not found in any of the following sources',
            'Could not resolve plugin artifact',
            'Could not GET', 'Could not HEAD', 'Could not POST',
            'Read timed out', 'timed out',
            'Connection refused', 'Connection reset', 'Connection timed out',
            'Remote host terminated the handshake',
            'Premature end of Content-Length',
            'SSLHandshakeException', 'SSLPeerUnverifiedException',
            'Unexpected end of file from server',
            'repository was unavailable', 'marked the repository unavailable',
            'Received status code 5', 'Received status code 429'
          )
          for ($i = 1; $i -le $maxAttempts; $i++) {
            $lines = @()
            ./gradlew :desktop:compileKotlin --no-daemon --stacktrace 2>&1 | Tee-Object -Variable lines
            $code = $LASTEXITCODE
            if ($code -eq 0) { Write-Host "Gradle warm-up OK on attempt $i."; exit 0 }
            $text = $lines | Out-String
            $isNetwork = $false
            foreach ($marker in $networkMarkers) {
              if ($text.IndexOf($marker, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
                $isNetwork = $true
                break
              }
            }
            if (-not $isNetwork) {
              Write-Error "Gradle warm-up attempt $i failed (exit $code) with an error that does not match any network/repository marker - see the full output above. Treated as a genuine build problem; NOT retried."
              exit 1
            }
            if ($i -lt $maxAttempts) {
              $wait = $backoffSeconds[$i - 1]
              Write-Warning "Gradle warm-up attempt $i failed (exit $code) with a repository/network error (like the multi-repo outage of 2026-09-02). Retrying in $wait s (attempt $($i + 1) of $maxAttempts)."
              Start-Sleep -Seconds $wait
            }
          }
          Write-Error "Gradle warm-up failed after $maxAttempts attempts - every failure matched a network/repository marker. See the last stacktrace above. If the artifact repositories stay unreachable this long, re-run the workflow once GitHub's infrastructure recovers."
          exit 1

      - name: Prefetch llama.cpp (pinned b11057)
        shell: pwsh
        run: |
          $dest = "desktop/native/llama.cpp-src"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
            git clone --depth 1 --branch b11057 https://github.com/ggml-org/llama.cpp $dest
            if ($LASTEXITCODE -eq 0) { Write-Host "llama.cpp cloned on attempt $attempt"; break }
            if ($attempt -eq 3) { Write-Error "Failed to clone llama.cpp after 3 attempts."; exit 1 }
            Start-Sleep -Seconds 10
          }

      - name: Build lucent_llama.dll (CMake, CPU baseline)
        continue-on-error: true
        shell: pwsh
        run: |
          cmake -S desktop/native -B desktop/native/build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build desktop/native/build --parallel
          New-Item -ItemType Directory -Force -Path desktop/src/main/resources/native | Out-Null
          $dll = Get-ChildItem -Recurse -Path desktop/native/build -Filter lucent_llama.dll | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName desktop/src/main/resources/native/lucent_llama.dll -Force
            Write-Host "Copied $($dll.FullName)"
          } else {
            Write-Warning "lucent_llama.dll not found; the packaged app will run without the on-device model."
          }

      - name: Cache Vulkan SDK installer
        uses: actions/cache@v4
        with:
          path: .vulkan-installer
          key: vulkan-installer-1.4.321.1

      - name: Install Vulkan SDK
        continue-on-error: true
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.321.1
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            function Get-Installer([string]$url, [string]$dest) {
              Write-Host "trying: $url"
              curl.exe -fSL -o $dest $url
              if ($LASTEXITCODE -ne 0) { Write-Host "  -> curl exit $LASTEXITCODE"; return $false }
              $magic = Get-Content -Path $dest -AsByteStream -TotalCount 2 -ErrorAction Stop
              if ($magic.Count -lt 2 -or $magic[0] -ne 0x4D -or $magic[1] -ne 0x5A) {
                Write-Host "  -> not a PE binary (no 'MZ' header)"; return $false
              }
              Write-Host "  -> OK ($([math]::Round((Get-Item $dest).Length / 1mb)) MB)"
              return $true
            }
            $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
            $cached = ".vulkan-installer\vulkan_sdk-$env:VULKAN_VERSION.exe"
            $versions = @($env:VULKAN_VERSION)
            $latest = (curl.exe -fsSL "https://vulkan.lunarg.com/sdk/latest/windows.txt")
            if ($LASTEXITCODE -eq 0 -and $latest) {
              $latest = $latest.Trim()
              if ($latest -match '^\d+(\.\d+){1,3}$') {
                Write-Host "LunarG latest/windows.txt reports: $latest"
                if ($latest -ne $env:VULKAN_VERSION) { $versions += $latest }
              } else {
                Write-Host "latest/windows.txt returned something that is not a version: '$latest' - ignoring it."
              }
            } else {
              Write-Host "could not query latest/windows.txt (curl exit $LASTEXITCODE)."
            }
            $got = $false
            if (Test-Path $cached) {
              $magic = Get-Content -Path $cached -AsByteStream -TotalCount 2 -ErrorAction SilentlyContinue
              if ($magic.Count -eq 2 -and $magic[0] -eq 0x4D -and $magic[1] -eq 0x5A) {
                Copy-Item $cached $installer -Force
                Write-Host "using cached installer ($([math]::Round((Get-Item $installer).Length / 1mb)) MB) - no download needed."
                $got = $true
              }
            }
            if (-not $got) {
              foreach ($ver in $versions) {
                foreach ($name in "vulkan_sdk.exe", "VulkanSDK-$ver-Installer.exe", "vulkansdk-windows-X64-$ver.exe", "vulkan-sdk.exe") {
                  if (Get-Installer "https://sdk.lunarg.com/sdk/download/$ver/windows/$name" $installer) { $got = $true; break }
                }
                if ($got) { break }
              }
              if ($got) {
                New-Item -ItemType Directory -Force -Path .vulkan-installer | Out-Null
                Copy-Item $installer $cached -Force
              }
            }
            if (-not $got) {
              foreach ($name in "vulkan_sdk.exe", "vulkan-sdk.exe") {
                if (Get-Installer "https://sdk.lunarg.com/sdk/download/latest/windows/$name" $installer) { $got = $true; break }
              }
            }
            $sdkPath = $null
            if ($got) {
              $proc = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -ErrorAction Stop
              if ($proc.ExitCode -ne 0) { throw "installer exited with code $($proc.ExitCode)" }
              $dir = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction Stop | Sort-Object Name -Descending | Select-Object -First 1
              if (-not $dir) { throw "installer succeeded but C:\VulkanSDK contains no SDK directory" }
              $sdkPath = $dir.FullName
              Write-Host "Vulkan SDK $($dir.Name) installed at $sdkPath."
            } else {
              Write-Warning "No LunarG installer URL worked; assembling a minimal Vulkan SDK from Khronos sources instead."
              $mini = Join-Path $env:RUNNER_TEMP "vk-mini-sdk"
              New-Item -ItemType Directory -Force -Path "$mini\Include","$mini\Lib","$mini\Bin" | Out-Null
              $src = Join-Path $env:RUNNER_TEMP "vk-src"
              git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers "$src\headers"
              git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers "$src\spirv"
              git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Loader "$src\loader"
              foreach ($r in "headers","spirv","loader") { Write-Host ("  {0} @ {1}" -f $r, (git -C "$src\$r" rev-parse --short HEAD)) }
              cmake -S "$src\headers" -B "$src\headers\b" | Out-Null
              cmake --install "$src\headers\b" --prefix "$src\headers\out" | Out-Null
              Copy-Item -Recurse -Force "$src\headers\out\include\*" "$mini\Include\"
              Copy-Item -Recurse -Force "$src\spirv\include\spirv" "$mini\Include\"
              cmake -S "$src\loader" -B "$src\loader\b" -A x64 -DVULKAN_HEADERS_INSTALL_DIR="$src\headers\out" -DBUILD_TESTS=OFF
              cmake --build "$src\loader\b" --config Release --parallel
              $lib = Get-ChildItem -Recurse -Path "$src\loader\b" -Filter vulkan-1.lib | Select-Object -First 1
              if (-not $lib) { throw "Vulkan-Loader build produced no vulkan-1.lib" }
              Copy-Item $lib.FullName "$mini\Lib\vulkan-1.lib" -Force
              $ndkRoots = @($env:ANDROID_NDK_HOME, $env:ANDROID_NDK_ROOT, $env:ANDROID_NDK, $env:ANDROID_NDK_LATEST_HOME) | Where-Object { $_ }
              if ($env:ANDROID_SDK_ROOT) { $ndkRoots += (Get-ChildItem "$env:ANDROID_SDK_ROOT\ndk" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object FullName) }
              $glslc = $ndkRoots | ForEach-Object { Join-Path $_ "shader-tools\windows-x86_64\glslc.exe" } | Where-Object { Test-Path $_ } | Select-Object -First 1
              if (-not $glslc) { throw "no glslc found in any preinstalled Android NDK (looked in: $($ndkRoots -join '; '))" }
              Write-Host "using NDK glslc: $glslc"
              Copy-Item $glslc "$mini\Bin\glslc.exe" -Force
              $sdkPath = $mini
              Write-Host "Minimal Vulkan SDK assembled at $sdkPath."
            }
            "VULKAN_SDK=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } catch {
            Write-Warning "Vulkan SDK unavailable ($($_.Exception.Message)); skipping the GPU engine build. The CPU engine still ships."
          }
          exit 0

      - name: Build lucent_llama_vk.dll (CMake, Vulkan GPU backend)
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not $env:VULKAN_SDK -or -not (Test-Path $env:VULKAN_SDK)) {
            Write-Warning "Vulkan SDK unavailable; skipping the GPU engine build (the CPU engine above still ships)."
            exit 0
          }
          cmake -S desktop/native -B desktop/native/build-vk -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUCENT_ENABLE_VULKAN=ON `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build desktop/native/build-vk --parallel
          $dll = Get-ChildItem -Recurse -Path desktop/native/build-vk -Filter lucent_llama.dll | Select-Object -First 1
          if ($dll) {
            New-Item -ItemType Directory -Force -Path desktop/src/main/resources/native | Out-Null
            Copy-Item $dll.FullName desktop/src/main/resources/native/lucent_llama_vk.dll -Force
            Write-Host "Copied $($dll.FullName) as lucent_llama_vk.dll"
          } else {
            Write-Warning "Vulkan engine build produced no DLL; the app ships CPU-only (the GPU switch will fall back to CPU)."
          }

      - name: Cache Cargo (registry + rust/target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-win-msvc-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-win-msvc-

      - name: Set up Rust (MSVC target)
        continue-on-error: true
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build lucent_native.dll (cargo)
        continue-on-error: true
        shell: pwsh
        run: |
          cargo build --release --manifest-path rust/Cargo.toml --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path desktop/src/main/resources/native | Out-Null
          $dll = "rust/target/x86_64-pc-windows-msvc/release/lucent_native.dll"
          if (Test-Path $dll) {
            Copy-Item $dll desktop/src/main/resources/native/lucent_native.dll -Force
            Write-Host "Copied $dll"
          } else {
            Write-Warning "lucent_native.dll not found; the app will use its Kotlin/JCE fallbacks."
          }

      - name: Verify database encryption (cipher self-check)
        shell: pwsh
        run: |
          ./gradlew :desktop:cipherSelfCheck --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "cipherSelfCheck attempt 1 failed (exit $LASTEXITCODE); retrying once in 30 s in case it was a transient fetch."
            Start-Sleep -Seconds 30
            ./gradlew :desktop:cipherSelfCheck --no-daemon --stacktrace
          }
          exit $LASTEXITCODE

      - name: Report bundled engines
        shell: pwsh
        run: |
          $dir = "desktop/src/main/resources/native"
          $rows = @()
          foreach ($name in "lucent_llama.dll","lucent_llama_vk.dll","lucent_native.dll") {
            $f = Join-Path $dir $name
            if (Test-Path $f) {
              $kb = [math]::Round((Get-Item $f).Length / 1kb)
              $rows += "| $name | bundled | $kb KB |"
            } else {
              $rows += "| $name | absent | - |"
            }
          }
          $summary = @("### Engines in this installer", "", "| DLL | Status | Size |", "|---|---|---|") + $rows
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Cache WiX (Compose downloadWix output)
        uses: actions/cache@v4
        with:
          path: desktop/build/wixToolset
          key: wix311-compose

      - name: Package Windows .exe
        shell: pwsh
        run: |
          ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "packaging attempt 1 failed (exit $LASTEXITCODE); retrying once in 30 s in case it was a transient fetch."
            Start-Sleep -Seconds 30
            ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon --stacktrace
          }
          exit $LASTEXITCODE

      - name: Sign installer (runs only when signing secrets are configured)
        shell: pwsh
        env:
          LUCENT_SIGN_PFX_BASE64: ${{ secrets.LUCENT_SIGN_PFX_BASE64 }}
          LUCENT_SIGN_PFX_PASSWORD: ${{ secrets.LUCENT_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:LUCENT_SIGN_PFX_BASE64 -or -not $env:LUCENT_SIGN_PFX_PASSWORD) {
            Write-Host "::notice title=Installer not signed::LUCENT_SIGN_PFX_BASE64 / LUCENT_SIGN_PFX_PASSWORD are not set - uploading an unsigned installer. Add both under Settings -> Secrets and variables -> Actions to enable signing."
            exit 0
          }
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found on this runner image."; exit 1 }
          Write-Host "using $($signtool.FullName)"
          $pfx = Join-Path $env:RUNNER_TEMP "lucent-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:LUCENT_SIGN_PFX_BASE64))
          try {
            $exes = Get-ChildItem "desktop/build/compose/binaries/main/exe/*.exe"
            if (-not $exes) { Write-Error "no installer .exe found to sign"; exit 1 }
            foreach ($exe in $exes) {
              & $signtool.FullName sign /f $pfx /p $env:LUCENT_SIGN_PFX_PASSWORD /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $exe.FullName
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "signing with timestamp failed (server hiccup?); retrying without a timestamp."
                & $signtool.FullName sign /f $pfx /p $env:LUCENT_SIGN_PFX_PASSWORD /fd SHA256 $exe.FullName
                if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed on $($exe.Name)"; exit 1 }
              }
            }
          } finally {
            Remove-Item $pfx -ErrorAction SilentlyContinue
          }

      - name: Rename installer to the release asset name
        shell: pwsh
        run: |
          $ver = "${{ steps.resolve-version.outputs.version }}"
          $exe = Get-ChildItem desktop/build/compose/binaries/main/exe/*.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "no installer .exe found to rename"; exit 1 }
          $target = "Lucent.for.Windows-$ver.exe"
          if ($exe.Name -ne $target) { Move-Item -Force $exe.FullName (Join-Path $exe.DirectoryName $target) }
          Write-Host "renamed to $target"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lucent-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs: [build-apk, build-windows]
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Resolve version
        id: resolve-version
        run: |
          VER="${{ inputs.version_name }}"
          if [ -z "$VER" ]; then
            VER=$(sed -n 's/^val MARKETING_VERSION = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VER"

      - name: Validate version format
        run: |
          VERSION="${{ steps.resolve-version.outputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in x.y.z format (e.g., 2.8.4)"
            exit 1
          fi

      - name: Download APK artifact
        run: |
          echo "Downloading APK..."
          gh run download ${{ github.run_id }} -n lucent-release-apk -D ./artifacts/apk
          ls -lh ./artifacts/apk/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows artifact
        run: |
          echo "Downloading Windows EXE..."
          gh run download ${{ github.run_id }} -n lucent-windows-exe -D ./artifacts/windows
          ls -lh ./artifacts/windows/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifacts
        run: |
          APK_FILE=$(find ./artifacts/apk -name "*.apk" | head -1)
          EXE_FILE=$(find ./artifacts/windows -name "*.exe" | head -1)
          if [ -z "$APK_FILE" ]; then echo "::error::APK file not found"; exit 1; fi
          if [ -z "$EXE_FILE" ]; then echo "::error::EXE file not found"; exit 1; fi
          APK_SIZE=$(stat -c%s "$APK_FILE")
          EXE_SIZE=$(stat -c%s "$EXE_FILE")
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "EXE_FILE=$EXE_FILE" >> $GITHUB_ENV
          echo "APK_SIZE_MB=$(python3 -c "print(f'{$APK_SIZE/1048576:.2f}')")" >> $GITHUB_ENV
          echo "EXE_SIZE_MB=$(python3 -c "print(f'{$EXE_SIZE/1048576:.2f}')")" >> $GITHUB_ENV
          echo "Found APK: $APK_FILE ($(python3 -c "print(f'{$APK_SIZE/1048576:.2f}')") MiB)"
          echo "Found EXE: $EXE_FILE ($(python3 -c "print(f'{$EXE_SIZE/1048576:.2f}')") MiB)"

      - name: Create git tag
        run: |
          VER="${{ steps.resolve-version.outputs.version }}"
          git config user.name "Lucent Release Bot"
          git config user.email "release@lucent.app"
          git tag -a "v$VER" -m "Release v$VER"
          git push origin "v$VER"
          echo "Tag v$VER created and pushed"

      - name: Compose release notes
        run: |
          VER="${{ steps.resolve-version.outputs.version }}"
          if [ -f "RELEASE_NOTES_$VER.md" ]; then
            cat "RELEASE_NOTES_$VER.md" > /tmp/notes.txt
          else
            echo "Release v$VER" > /tmp/notes.txt
          fi
          cat >> /tmp/notes.txt <<'BUILDINFO'

          ---

          **Build Info**
          BUILDINFO
          echo "- APK Size: ${{ env.APK_SIZE_MB }} MiB" >> /tmp/notes.txt
          echo "- Windows EXE Size: ${{ env.EXE_SIZE_MB }} MiB" >> /tmp/notes.txt
          echo "- APK Build: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/notes.txt
          echo "- Windows Build: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/notes.txt
          echo "- Built from commit: \`${{ github.sha }}\`" >> /tmp/notes.txt

      - name: Create draft release
        run: |
          VER="${{ steps.resolve-version.outputs.version }}"
          gh release create "v$VER" \
            --draft \
            --title "Lucent $VER" \
            --notes-file /tmp/notes.txt \
            "${{ env.APK_FILE }}" \
            "${{ env.EXE_FILE }}"
          echo "::notice::Draft release v$VER created successfully"
          echo "::notice::APK and EXE uploaded"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output release URL
        run: |
          VER="${{ steps.resolve-version.outputs.version }}"
          URL=$(gh release view "v$VER" --json url --jq '.url')
          echo "::notice::Draft release: $URL"
          echo "release_url=$URL" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}