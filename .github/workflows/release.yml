
name: Create Release with Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.8.3)'
        required: true
      title:
        description: 'Release title (e.g., "Lucent 2.8.3 — The Swipe Becomes Natural")'
        required: true
      release_notes:
        description: 'Release notes (markdown)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in x.y.z format (e.g., 2.8.3)"
            exit 1
          fi
          echo "Version format valid: $VERSION"

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Check signing secrets are configured
        env:
          LUCENT_KEYSTORE_BASE64: ${{ secrets.LUCENT_KEYSTORE_BASE64 }}
          LUCENT_KEYSTORE_PASSWORD: ${{ secrets.LUCENT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$LUCENT_KEYSTORE_BASE64" ] || [ -z "$LUCENT_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secret LUCENT_KEYSTORE_BASE64 and/or LUCENT_KEYSTORE_PASSWORD."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Install Android SDK components
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-android-ndk4.1.2-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-android-ndk4.1.2-

      - name: Set up Rust for Android
        run: |
          set -eu
          rustup target add aarch64-linux-android armv7-linux-androideabi
          if cargo ndk --version 2>/dev/null | grep -q "4.1.2"; then
            echo "cargo-ndk 4.1.2 already present"
          else
            cargo install cargo-ndk --version 4.1.2 --locked
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Prefetch llama.cpp
        run: |
          set -eu
          DEST="app/src/main/cpp/llama.cpp-src"
          for attempt in 1 2 3; do
            rm -rf "$DEST"
            if git clone --depth 1 --branch b11057 https://github.com/ggml-org/llama.cpp "$DEST"; then
              echo "llama.cpp cloned on attempt $attempt"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Failed to clone llama.cpp after 3 attempts."
              exit 1
            fi
            sleep 10
          done

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-lucent-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-lucent-${{ runner.os }}-

      - name: Set up ccache
        run: |
          set -eu
          command -v ccache >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ccache; }
          echo "CCACHE_DIR=${{ runner.temp }}/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ccache"

      - name: Provide Vulkan shader compiler
        run: |
          set -eu
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          GLSLC_DIR="$NDK/shader-tools/linux-x86_64"
          OK=0
          if [ -x "$GLSLC_DIR/glslc" ]; then
            if [ -f "$GLSLC_DIR/libc++.so" ] && [ ! -e "$GLSLC_DIR/libc++.so.1" ]; then
              ln -sf libc++.so "$GLSLC_DIR/libc++.so.1" || true
            fi
            if LD_LIBRARY_PATH="$GLSLC_DIR:${LD_LIBRARY_PATH:-}" "$GLSLC_DIR/glslc" --version; then
              echo "$GLSLC_DIR" >> "$GITHUB_PATH"
              echo "LD_LIBRARY_PATH=$GLSLC_DIR:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
              OK=1
            fi
          fi
          if [ "$OK" != "1" ]; then
            sudo apt-get update
            sudo apt-get install -y glslc || sudo apt-get install -y glslang-tools || true
          fi

      - name: Provide SPIRV-Headers
        run: |
          set -eu
          SRC="$RUNNER_TEMP/spirv-headers"
          PREFIX="$RUNNER_TEMP/spirv-headers-install"
          for attempt in 1 2 3; do
            rm -rf "$SRC"
            if git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers "$SRC"; then break; fi
            [ "$attempt" = "3" ] && { echo "::error::Failed to clone SPIRV-Headers."; exit 1; }
            sleep 5
          done
          cmake -S "$SRC" -B "$SRC/build" -DCMAKE_INSTALL_PREFIX="$PREFIX" >/dev/null
          cmake --install "$SRC/build" >/dev/null
          CFG="$(find "$PREFIX" -name 'SPIRV-HeadersConfig.cmake' -o -name 'spirv-headers-config.cmake' | head -n 1)"
          CFG_DIR="$(dirname "$CFG")"
          echo "LUCENT_SPIRV_HEADERS_DIR=$CFG_DIR" >> "$GITHUB_ENV"

      - name: Provide Vulkan headers
        run: |
          set -eu
          SRC="$RUNNER_TEMP/vulkan-headers"
          for attempt in 1 2 3; do
            rm -rf "$SRC"
            if git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers "$SRC"; then break; fi
            [ "$attempt" = "3" ] && { echo "::error::Failed to clone Vulkan-Headers."; exit 1; }
            sleep 5
          done
          if [ -d "$RUNNER_TEMP/spirv-headers/include/spirv" ]; then
            cp -r "$RUNNER_TEMP/spirv-headers/include/spirv" "$SRC/include/"
          elif [ -d "$RUNNER_TEMP/spirv-headers-install/include/spirv" ]; then
            cp -r "$RUNNER_TEMP/spirv-headers-install/include/spirv" "$SRC/include/"
          fi
          echo "LUCENT_VULKAN_INCLUDE_DIR=$SRC/include" >> "$GITHUB_ENV"

      - name: Decode release keystore
        env:
          LUCENT_KEYSTORE_BASE64: ${{ secrets.LUCENT_KEYSTORE_BASE64 }}
        run: |
          set -eu
          printf '%s' "$LUCENT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lucent-release.keystore"

      - name: Assemble signed release APK
        env:
          LUCENT_KEYSTORE_FILE: ${{ runner.temp }}/lucent-release.keystore
          LUCENT_KEYSTORE_PASSWORD: ${{ secrets.LUCENT_KEYSTORE_PASSWORD }}
          LUCENT_KEY_ALIAS: lucent
        run: |
          set -eu
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName='${{ inputs.version }}'

      - name: Verify and rename APK
        run: |
          set -eu
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)
          [ -n "$APK" ] || { echo "::error::No release APK found"; exit 1; }
          
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"
          
          mv "$APK" "app/build/outputs/apk/release/Lucent.for.Android-${{ inputs.version }}.apk"
          
          SIZE_BYTES="$(stat -c%s "app/build/outputs/apk/release/Lucent.for.Android-${{ inputs.version }}.apk")"
          SIZE_MB="$(python3 -c "print(f'{$SIZE_BYTES/1048576:.2f}')")"
          echo "APK_SIZE_MB=$SIZE_MB" >> "$GITHUB_ENV"
          echo "::notice::APK size: ${SIZE_MB} MiB"

      - name: Upload R8 mapping artifact
        uses: actions/upload-artifact@v6
        with:
          name: r8-mapping-${{ inputs.version }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ inputs.version }}
          release_name: ${{ inputs.title }}
          body: |
            ${{ inputs.release_notes }}
            
            ---
            
            **Build Info**
            - APK Size: ${{ env.APK_SIZE_MB }} MiB
            - Version Code: ${{ github.run_number }}
            - Built from: `${{ github.sha }}`
          draft: false
          prerelease: ${{ inputs.prerelease }}

      - name: Upload Release APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/release/Lucent.for.Android-${{ inputs.version }}.apk
          asset_name: Lucent.for.Android-${{ inputs.version }}.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload R8 mapping to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/mapping/release/mapping.txt
          asset_name: mapping-${{ inputs.version }}.txt
          asset_content_type: text/plain
        continue-on-error: true
