name: Release (APK + EXE + draft)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v2.9.0. Created at the commit you run this from if it does not exist yet.'
        required: true
        type: string
      release_name:
        description: 'Release name, e.g. "Lucent 2.9 — Privileges, Provenance, and a Quieter Update".'
        required: true
        type: string
      version_name:
        description: 'Version baked into the builds, e.g. 2.9.0. Leave blank to take it from the tag.'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'Release notes in Markdown. Leave blank to use RELEASE_NOTES_<version>.md from the repo.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create the release as a draft (true) or publish it immediately (false).'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Resolve tag and version
        id: resolve
        env:
          IN_TAG: ${{ inputs.tag }}
          IN_VERSION: ${{ inputs.version_name }}
        run: |
          set -eu
          TAG="$(printf '%s' "$IN_TAG" | tr -d '[:space:]')"
          if [ -z "$TAG" ]; then echo "::error::The tag input is required."; exit 1; fi
          VER="$(printf '%s' "$IN_VERSION" | tr -d '[:space:]')"
          if [ -z "$VER" ]; then
            VER="${TAG#v}"
            VER="${VER#V}"
          fi
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VER' is not in x.y.z form. Give version_name explicitly if the tag is not v<version>."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Releasing tag $TAG as version $VER"

  apk:
    needs: prepare
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit
    with:
      version_name: ${{ needs.prepare.outputs.version }}

  exe:
    needs: prepare
    uses: ./.github/workflows/build-exe.yml
    secrets: inherit
    with:
      version_name: ${{ needs.prepare.outputs.version }}

  create-release:
    runs-on: ubuntu-latest
    needs: [prepare, apk, exe]
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the APK artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh run download "${{ github.run_id }}" -n lucent-release-apk -D ./artifacts/apk
          ls -lh ./artifacts/apk/

      - name: Download the Windows artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh run download "${{ github.run_id }}" -n lucent-windows-exe -D ./artifacts/windows
          ls -lh ./artifacts/windows/

      - name: Verify both assets are present
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          APK_FILE="$(find ./artifacts/apk -name '*.apk' | head -n 1)"
          EXE_FILE="$(find ./artifacts/windows -name '*.exe' | head -n 1)"
          [ -n "$APK_FILE" ] || { echo "::error::No APK was produced - no release is created."; exit 1; }
          [ -n "$EXE_FILE" ] || { echo "::error::No installer was produced - no release is created."; exit 1; }
          APK_BYTES="$(stat -c%s "$APK_FILE")"
          EXE_BYTES="$(stat -c%s "$EXE_FILE")"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "EXE_FILE=$EXE_FILE" >> "$GITHUB_ENV"
          echo "APK_SIZE_MB=$(python3 -c "print(f'{$APK_BYTES/1048576:.2f}')")" >> "$GITHUB_ENV"
          echo "EXE_SIZE_MB=$(python3 -c "print(f'{$EXE_BYTES/1048576:.2f}')")" >> "$GITHUB_ENV"
          echo "Both assets are ready for version $VERSION."

      - name: Compose the release body
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          set -eu
          NOTES_FILE="RELEASE_NOTES_${VERSION}.md"
          if [ -n "$NOTES_INPUT" ]; then
            printf '%s\n' "$NOTES_INPUT" > /tmp/notes.md
          elif [ -f "$NOTES_FILE" ]; then
            cat "$NOTES_FILE" > /tmp/notes.md
          else
            printf 'Lucent %s\n' "$VERSION" > /tmp/notes.md
          fi
          {
            printf '\n---\n\n'
            printf '**Build info**\n\n'
            printf -- '- Android APK: %s MiB\n' "$APK_SIZE_MB"
            printf -- '- Windows installer: %s MiB\n' "$EXE_SIZE_MB"
            printf -- '- Built from commit `%s`\n' "${{ github.sha }}"
            printf -- '- Build log: https://github.com/%s/actions/runs/%s\n' "${{ github.repository }}" "${{ github.run_id }}"
          } >> /tmp/notes.md

      - name: Create the release and attach both assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          AS_DRAFT: ${{ inputs.draft }}
        run: |
          set -eu
          TITLE="$RELEASE_NAME"
          if [ -z "$TITLE" ]; then
            TITLE="Lucent ${{ needs.prepare.outputs.version }}"
          fi
          DRAFT_FLAG=""
          if [ "$AS_DRAFT" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          EXISTING="$(gh release view "$TAG" --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            echo "::notice::Release $TAG already exists - refreshing its notes and assets."
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/notes.md
            gh release upload "$TAG" "$APK_FILE" "$EXE_FILE" --clobber
          else
            gh release create "$TAG" \
              $DRAFT_FLAG \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes-file /tmp/notes.md \
              "$APK_FILE" \
              "$EXE_FILE"
          fi
          gh release view "$TAG" --json url,isDraft --jq '"Release " + .url + " (draft=" + (.isDraft|tostring) + ")"'
