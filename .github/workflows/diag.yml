name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: Dump desktop test runtime classpath
        run: ./gradlew :desktop:printTestCp --no-daemon --console=plain

      - name: Show datetime dependency insight
        run: ./gradlew :desktop:dependencyInsight --dependency kotlinx-datetime --configuration testRuntimeClasspath --no-daemon --console=plain
