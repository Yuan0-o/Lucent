name: Build Preview (APK + EXE + Preview)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 2.9.0. Leave blank to use default.'
        required: false
        default: ''
  workflow_call:
    inputs:
      version_name:
        description: 'Version name'
        required: false
        type: string
        default: ''
      build_id:
        description: 'Build ID (e.g. R202610061243)'
        required: false
        type: string
        default: ''
      create_release:
        description: Create preview GitHub release
        required: false
        type: boolean
        default: true
    outputs:
      apk_version:
        description: "Version of APK"
        value: ${{ jobs.build-apk.outputs.version }}
      exe_version:
        description: "Version of EXE"
        value: ${{ jobs.build-exe.outputs.version }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build_id: ${{ steps.gen.outputs.build_id }}
    steps:
      - id: gen
        run: |
          BID="${{ inputs.build_id }}"
          if [ -z "$BID" ]; then
            BID="P$(date -u +%Y%m%d%H%M)"
          fi
          echo "build_id=$BID" >> "$GITHUB_OUTPUT"
          echo "Build ID: $BID"

  build-apk:
    needs: prepare
    runs-on: ubuntu-24.04

    steps:
      - name: Mark workspace as safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global init.defaultBranch main

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Resolve version
        id: resolve-version
        run: |
          set -eu
          VER="${{ inputs.version_name }}"
          if [ -z "$VER" ]; then
            VER=$(sed -n 's/^val MARKETING_VERSION = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          fi
          if [ -z "$VER" ]; then echo "::error::Could not determine the version."; exit 1; fi
          DIGITS=$(printf '%s' "$VER" | tr -cd '0-9')
          if [ -z "$DIGITS" ]; then echo "::error::Version '$VER' has no digits to build a version code from."; exit 1; fi
          # versionCode must always increase so a new build installs over any older one.
          # GITHUB_RUN_NUMBER resets to 1 when a workflow file is renamed, which once
          # made new builds uninstallable over older ones, so use UTC minutes instead.
          MINUTES=$(( $(date -u +%s) / 60 ))
          CODE=$(( DIGITS * 100000 + MINUTES ))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building APK for version $VER (versionCode $CODE)"

      - name: Check signing secrets
        env:
          LUCENT_KEYSTORE_BASE64: ${{ secrets.LUCENT_KEYSTORE_BASE64 }}
          LUCENT_KEYSTORE_PASSWORD: ${{ secrets.LUCENT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$LUCENT_KEYSTORE_BASE64" ] || [ -z "$LUCENT_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing signing secrets."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-android-ndk4.1.2-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-android-ndk4.1.2-

      - name: Set up Rust for Android
        run: |
          set -eu
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          if cargo ndk --version 2>/dev/null | grep -q "4.1.2"; then
            echo "cargo-ndk 4.1.2 already present (cache hit)."
          else
            cargo install cargo-ndk --version 4.1.2 --locked
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Prefetch llama.cpp
        run: |
          set -eu
          DEST="app/src/main/cpp/llama.cpp-src"
          for attempt in 1 2 3; do
            rm -rf "$DEST"
            git clone --depth 1 --branch b11057 https://github.com/ggml-org/llama.cpp "$DEST" && break
            [ "$attempt" = "3" ] && { echo "::error::Failed to clone llama.cpp."; exit 1; }
            sleep 10
          done

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-lucent-${{ runner.os }}-${{ hashFiles('.github/workflows/build-preview.yml') }}
          restore-keys: ccache-lucent-${{ runner.os }}-

      - name: Set up ccache
        run: |
          set -eu
          command -v ccache >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ccache; }
          echo "CCACHE_DIR=${{ runner.temp }}/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ccache"
          ccache --version | head -1

      - name: Provide glslc
        run: |
          set -eu
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          GLSLC_DIR="$NDK/shader-tools/linux-x86_64"
          OK=0
          if [ -x "$GLSLC_DIR/glslc" ]; then
            [ -f "$GLSLC_DIR/libc++.so" ] && [ ! -e "$GLSLC_DIR/libc++.so.1" ] && ln -sf libc++.so "$GLSLC_DIR/libc++.so.1" || true
            if LD_LIBRARY_PATH="$GLSLC_DIR:${LD_LIBRARY_PATH:-}" "$GLSLC_DIR/glslc" --version; then
              echo "$GLSLC_DIR" >> "$GITHUB_PATH"
              echo "LD_LIBRARY_PATH=$GLSLC_DIR:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
              OK=1
            fi
          fi
          if [ "$OK" != "1" ]; then
            sudo apt-get update && sudo apt-get install -y glslc || true
          fi

      - name: Provide SPIRV-Headers
        run: |
          set -eu
          SRC="$RUNNER_TEMP/spirv-headers"; PREFIX="$RUNNER_TEMP/spirv-headers-install"
          for attempt in 1 2 3; do
            rm -rf "$SRC"
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers "$SRC" && break
            [ "$attempt" = "3" ] && { echo "::error::Failed to clone SPIRV-Headers."; exit 1; }; sleep 5
          done
          cmake -S "$SRC" -B "$SRC/build" -DCMAKE_INSTALL_PREFIX="$PREFIX" >/dev/null
          cmake --install "$SRC/build" >/dev/null
          CFG="$(find "$PREFIX" -name 'SPIRV-HeadersConfig.cmake' -o -name 'spirv-headers-config.cmake' | head -n 1)"
          [ -n "$CFG" ] || { echo "::error::SPIRV-Headers config not found."; exit 1; }
          echo "LUCENT_SPIRV_HEADERS_DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"

      - name: Provide Vulkan headers
        run: |
          set -eu
          SRC="$RUNNER_TEMP/vulkan-headers"
          for attempt in 1 2 3; do
            rm -rf "$SRC"
            git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers "$SRC" && break
            [ "$attempt" = "3" ] && { echo "::error::Failed to clone Vulkan-Headers."; exit 1; }; sleep 5
          done
          for d in "$RUNNER_TEMP/spirv-headers/include/spirv" "$RUNNER_TEMP/spirv-headers-install/include/spirv"; do
            [ -d "$d" ] && cp -r "$d" "$SRC/include/" && break
          done
          echo "LUCENT_VULKAN_INCLUDE_DIR=$SRC/include" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          LUCENT_KEYSTORE_BASE64: ${{ secrets.LUCENT_KEYSTORE_BASE64 }}
        run: printf '%s' "$LUCENT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lucent-release.keystore"

      - name: Assemble signed APK
        env:
          LUCENT_KEYSTORE_FILE: ${{ runner.temp }}/lucent-release.keystore
          LUCENT_KEYSTORE_PASSWORD: ${{ secrets.LUCENT_KEYSTORE_PASSWORD }}
          LUCENT_KEY_ALIAS: lucent
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ steps.resolve-version.outputs.version_code }} \
            -PversionName='${{ steps.resolve-version.outputs.version }}' \
            -PbuildId='${{ needs.prepare.outputs.build_id }}'

      - name: Verify APK
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          [ -n "$APK" ] || { echo "::error::No signed APK found."; exit 1; }
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"
          echo "APK verified: $APK ($(stat -c%s "$APK") bytes)"

      - name: Rename APK
        run: |
          VER="${{ steps.resolve-version.outputs.version }}"
          BID="${{ needs.prepare.outputs.build_id }}"
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)
          mv "$APK" "app/build/outputs/apk/release/Lucent.for.Android-$VER-$BID.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: lucent-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r8-mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  build-exe:
    needs: prepare
    runs-on: windows-latest
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}

    steps:
      - name: Mark workspace as safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global init.defaultBranch main

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Resolve version
        id: resolve-version
        shell: pwsh
        run: |
          $ver = "${{ inputs.version_name }}"
          if (-not $ver) {
            $ver = (Select-String -Path desktop/build.gradle.kts -Pattern 'packageVersion = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          }
          if (-not $ver) { Write-Error "Could not determine version"; exit 1 }
          echo "version=$ver" >> "$env:GITHUB_OUTPUT"
          Write-Host "Building EXE for version $ver"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Create sccache cache directory
        shell: pwsh
        run: |
          $dir = if ($env:SCCACHE_DIR) { $env:SCCACHE_DIR } else { "$env:LOCALAPPDATA\Mozilla\sccache" }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

      - name: Resolve Gradle dependencies
        shell: pwsh
        run: |
          $maxAttempts = 6
          $backoffSeconds = @(45, 60, 120, 240, 300)
          $networkMarkers = @(
            'was not found in any of the following sources',
            'Could not resolve plugin artifact',
            'Could not GET', 'Could not HEAD', 'Could not POST',
            'Read timed out', 'timed out',
            'Connection refused', 'Connection reset', 'Connection timed out',
            'Remote host terminated the handshake',
            'Premature end of Content-Length',
            'SSLHandshakeException', 'SSLPeerUnverifiedException',
            'Unexpected end of file from server',
            'repository was unavailable', 'marked the repository unavailable',
            'Received status code 5', 'Received status code 429'
          )
          for ($i = 1; $i -le $maxAttempts; $i++) {
            $lines = @()
            ./gradlew :desktop:compileKotlin --no-daemon --stacktrace 2>&1 | Tee-Object -Variable lines
            $code = $LASTEXITCODE
            if ($code -eq 0) { Write-Host "Gradle warm-up OK on attempt $i."; exit 0 }
            $text = $lines | Out-String
            $isNetwork = $false
            foreach ($marker in $networkMarkers) {
              if ($text.IndexOf($marker, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) { $isNetwork = $true; break }
            }
            if (-not $isNetwork) { Write-Error "Genuine build error on attempt $i."; exit 1 }
            if ($i -lt $maxAttempts) { Start-Sleep -Seconds $backoffSeconds[$i - 1] }
          }
          Write-Error "Failed after $maxAttempts network-retries."; exit 1

      - name: Prefetch llama.cpp
        shell: pwsh
        run: |
          $dest = "desktop/native/llama.cpp-src"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
            git clone --depth 1 --branch b11057 https://github.com/ggml-org/llama.cpp $dest
            if ($LASTEXITCODE -eq 0) { Write-Host "llama.cpp cloned on attempt $attempt"; break }
            if ($attempt -eq 3) { Write-Error "Failed to clone llama.cpp."; exit 1 }
            Start-Sleep -Seconds 10
          }

      - name: Build CPU engine
        continue-on-error: true
        shell: pwsh
        run: |
          cmake -S desktop/native -B desktop/native/build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build desktop/native/build --parallel
          New-Item -ItemType Directory -Force -Path desktop/src/main/resources/native | Out-Null
          $dll = Get-ChildItem -Recurse -Path desktop/native/build -Filter lucent_llama.dll | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName desktop/src/main/resources/native/lucent_llama.dll -Force }

      - name: Cache Vulkan SDK installer
        uses: actions/cache@v5
        with:
          path: .vulkan-installer
          key: vulkan-installer-1.4.321.1

      - name: Install Vulkan SDK
        continue-on-error: true
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.321.1
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            function Get-Installer([string]$url, [string]$dest) {
              curl.exe -fSL -o $dest $url
              if ($LASTEXITCODE -ne 0) { return $false }
              $magic = Get-Content -Path $dest -AsByteStream -TotalCount 2 -ErrorAction Stop
              return ($magic.Count -ge 2 -and $magic[0] -eq 0x4D -and $magic[1] -eq 0x5A)
            }
            $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
            $cached = ".vulkan-installer\vulkan_sdk-$env:VULKAN_VERSION.exe"
            if (Test-Path $cached) { Copy-Item $cached $installer -Force }
            if (-not (Test-Path $installer)) {
              Get-Installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/VulkanSDK-$env:VULKAN_VERSION-Installer.exe" $installer
            }
            if (Test-Path $installer) {
              $proc = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -ErrorAction Stop
              $dir = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction Stop | Sort-Object Name -Descending | Select-Object -First 1
              "VULKAN_SDK=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          } catch { Write-Warning "Vulkan SDK unavailable." }
          exit 0

      - name: Build GPU engine
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not $env:VULKAN_SDK -or -not (Test-Path $env:VULKAN_SDK)) { Write-Warning "Vulkan SDK missing; skipping GPU engine."; exit 0 }
          cmake -S desktop/native -B desktop/native/build-vk -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUCENT_ENABLE_VULKAN=ON `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build desktop/native/build-vk --parallel
          $dll = Get-ChildItem -Recurse -Path desktop/native/build-vk -Filter lucent_llama.dll | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName desktop/src/main/resources/native/lucent_llama_vk.dll -Force }

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-win-msvc-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-win-msvc-

      - name: Build Rust native DLL
        continue-on-error: true
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --manifest-path rust/Cargo.toml --target x86_64-pc-windows-msvc
          $dll = "rust/target/x86_64-pc-windows-msvc/release/lucent_native.dll"
          if (Test-Path $dll) {
            New-Item -ItemType Directory -Force -Path desktop/src/main/resources/native | Out-Null
            Copy-Item $dll desktop/src/main/resources/native/lucent_native.dll -Force
          }

      - name: Cipher self-check
        shell: pwsh
        run: |
          ./gradlew :desktop:cipherSelfCheck --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 30; ./gradlew :desktop:cipherSelfCheck --no-daemon --stacktrace }
          exit $LASTEXITCODE

      - name: Cache WiX
        uses: actions/cache@v5
        with:
          path: desktop/build/wixToolset
          key: wix311-compose

      - name: Package EXE
        shell: pwsh
        run: |
          ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon --stacktrace -PbuildId='${{ needs.prepare.outputs.build_id }}'
          if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 30; ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon --stacktrace -PbuildId='${{ needs.prepare.outputs.build_id }}' }
          exit $LASTEXITCODE

      - name: Sign installer
        shell: pwsh
        env:
          LUCENT_SIGN_PFX_BASE64: ${{ secrets.LUCENT_SIGN_PFX_BASE64 }}
          LUCENT_SIGN_PFX_PASSWORD: ${{ secrets.LUCENT_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:LUCENT_SIGN_PFX_BASE64 -or -not $env:LUCENT_SIGN_PFX_PASSWORD) {
            Write-Host "::notice title=Not signed::Signing secrets not configured."
            exit 0
          }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $pfx = Join-Path $env:RUNNER_TEMP "lucent-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:LUCENT_SIGN_PFX_BASE64))
          try {
            $exes = Get-ChildItem "desktop/build/compose/binaries/main/exe/*.exe"
            foreach ($exe in $exes) {
              & $signtool.FullName sign /f $pfx /p $env:LUCENT_SIGN_PFX_PASSWORD /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $exe.FullName
              if ($LASTEXITCODE -ne 0) { & $signtool.FullName sign /f $pfx /p $env:LUCENT_SIGN_PFX_PASSWORD /fd SHA256 $exe.FullName }
            }
          } finally { Remove-Item $pfx -ErrorAction SilentlyContinue }

      - name: Rename installer
        shell: pwsh
        run: |
          $ver = "${{ steps.resolve-version.outputs.version }}"
          $bid = "${{ needs.prepare.outputs.build_id }}"
          $exe = Get-ChildItem desktop/build/compose/binaries/main/exe/*.exe | Select-Object -First 1
          $target = "Lucent.for.Windows-$ver-$bid.exe"
          if ($exe.Name -ne $target) { Move-Item -Force $exe.FullName (Join-Path $exe.DirectoryName $target) }

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: lucent-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

  create-release:
    needs: [prepare, build-apk, build-exe]
    if: github.event_name == 'workflow_dispatch' || inputs.create_release == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Mark workspace as safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global init.defaultBranch main

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download EXE
        uses: actions/download-artifact@v6
        with:
          name: lucent-windows-exe
          path: artifacts/windows

      - name: Download APK
        uses: actions/download-artifact@v6
        with:
          name: lucent-release-apk
          path: artifacts/apk

      - name: Verify both assets are present
        run: |
          set -eu
          APK_FILE="$(find artifacts/apk -name '*.apk' | head -n 1)"
          EXE_FILE="$(find artifacts/windows -name '*.exe' | head -n 1)"
          [ -n "$APK_FILE" ] || { echo "::error::No APK was produced - no release is created."; exit 1; }
          [ -n "$EXE_FILE" ] || { echo "::error::No installer was produced - no release is created."; exit 1; }
          APK_BYTES="$(stat -c%s "$APK_FILE")"
          EXE_BYTES="$(stat -c%s "$EXE_FILE")"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "EXE_FILE=$EXE_FILE" >> "$GITHUB_ENV"
          echo "APK_SIZE_MB=$(python3 -c "print(f'{$APK_BYTES/1048576:.2f}')")" >> "$GITHUB_ENV"
          echo "EXE_SIZE_MB=$(python3 -c "print(f'{$EXE_BYTES/1048576:.2f}')")" >> "$GITHUB_ENV"

      - name: Compose the release body
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          VERSION: ${{ needs.build-exe.outputs.version }}
        run: |
          set -eu
          {
            printf 'Lucent %s Preview\n\n' "$VERSION"
            printf -- '---\n\n'
            printf 'Build info:\n'
            printf -- '- Build-ID: %s\n' "$BUILD_ID"
            printf -- '- Android APK: %s MiB\n' "$APK_SIZE_MB"
            printf -- '- Windows installer: %s MiB\n' "$EXE_SIZE_MB"
            printf -- '- Built from commit %s\n' "${{ github.sha }}"
            printf -- '- Build log: https://github.com/%s/actions/runs/%s\n' "${{ github.repository }}" "${{ github.run_id }}"
          } > /tmp/notes.md

      - name: Create the release and attach both assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
        run: |
          set -eu
          gh release create "$BUILD_ID" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "$BUILD_ID" \
            --notes-file /tmp/notes.md \
            "$APK_FILE" \
            "$EXE_FILE"
