# Backlog A-7 (2026-07-26): raised from 2 GiB. On the 4-vCPU/16 GiB CI runners, Kotlin compile and
# especially R8 are the dominant cost of the 10-minute assemble, and both benefit from headroom;
# UseParallelGC is the usual pairing for build JVMs. Treat as a measured experiment per the
# backlog: compare assemble wall time over 2-3 runs and keep whichever wins (revert = restore
# -Xmx2048m and drop the GC flag).
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Kotlin Gradle plugin (2.4.0) warns that Gradle 8.13 is deprecated and will be dropped in a
# future KGP release. Gradle 8.13 is still fully supported by AGP 8.12.2, so rather than force a
# larger AGP/Gradle upgrade we silence exactly that one forward-looking warning here — this is the
# suppression the warning itself documents. Remove it when migrating to AGP 9 + Gradle 9.x.
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning
